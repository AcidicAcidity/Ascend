version: '5.5.1'

services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 3
  backend:
    build: .
    container_name: backend
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
